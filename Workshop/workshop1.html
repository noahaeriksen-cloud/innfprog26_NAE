<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 1: Passord Generator</title>
</head>
<body>
    <main>
        <h2>Passoedgenerator</h2>
        <p>
            <label for="symbol">Hvilke tegn skal du bruke</label>
            <ul>
                <li><input type="checkbox" name="lowerCase" id="lowerCase">Små bokstaver</input></li>
                <li><input type="checkbox" name="upperCase" id="upperCase">Store bokstaver</input></li>
                <li><input type="checkbox" name="numbers" id="numbers">Tall</input></li>
                <li><input type="checkbox" name="other" id="other">Andre symboler/tegn</input></li>
            </ul>
        </p>
        <p>
            <label for="length">Hvor langth skal passordet være?</label>
            <input type="number" id="length" name="length" placeholder="Passord Lengde" value="8">
        </p>
        <button id="generate">Generer</button>
        
        <p>Utskrift av Passord:</p>
        <p id="passwordOutput">Ingen passord</p>

    </main>

    <script>
        //Regler og konfigurasjon
        let generatedPassword = ""
        const lowerCase = "abcdefghijklmnopqurstuvwxyzæøå"
        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ"
        const numbers = "0123456789"
        const other = ",.-_;:!#$%&/()=?§'@*¨^<> •Ωé†µ˛¸›‹ƒ∂ß≈ç‹›‘"

        document.getElementById("length").value

        document.getElementById("generate").addEventListener("click", function(event) {
            //TØM PASSORD-VARIABEL FOR Å GJØRE KLAR TIL NYTT PASSORD
            generatedPassword = ""
            //HVILKE SYMBOLER SKAL BLI BRUKT
            let allowedSymbols = lowerCase + upperCase + numbers + other
            //HENTE UT HVOR LANGT PASSORDET SKAL VÆRE
            const passwordLength = document.getElementById("length").value
            console.log("passwordLength", passwordLength)
            //Generer ett passord
            for(counter = 0; counter < passwordLength; counter++) {
                const randomSymbols = Math.floor(Math.random() * allowedSymbols.length)

                console.log(randomSymbols, allowedSymbols[randomSymbols])

                generatedPassword += allowedSymbols[randomSymbols]
            }

            console.log(generatedPassword)
            document.getElementById("passwordOutput").innerHTML = generatedPassword
            console.log(passwordOutput)
        })
    </script>
</body>
</html>
