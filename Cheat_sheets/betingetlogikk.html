<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for betinget logikk</title>
</head>
<body>
    <p id="loginStatus">ikke logget inn enda</p>

    <script>
        const username = "noah"
        const password = "brapassordfrfr"
        let loggedIn = false

        //IF-test som sjekker om innsendt brukernavn matcher systemet:
        if(username === "noah") {
            console.log("Brukernavn er riktig")
        } else {
            console.log("feil brukernavn")
        }

        //IF-test som sjekker om brukernavn og passord er riktig, og gjør klar loggen
        if(username === "noah" && password === "brapassordfrfr") {
            loggedIn = true
            console.log(loggedIn)
        } 

        //Sjekk om en bruker er logget inn, og oppdater grensesnitt hvis den er det:
        if(loggedIn) {
            document.getElementById("loginStatus").innerHTML = "Hællæ Noah"
        }
    </script>
</body>
</html>
